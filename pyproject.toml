[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalyst-trader"
version = "0.1.0"
description = "Zamvar Capital Fund 1 — provenance-enforced catalyst calendar and point-in-time universe."
requires-python = ">=3.10"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings>=2,<3",
    "sqlite-vec>=0.1.9",
    "statsmodels==0.14.6",  # cointegration (Engle-Granger/Johansen); pulls numpy/scipy/pandas/patsy
    "edgartools==5.49.0",  # SEC EDGAR filings + XBRL fundamentals (CIK-internal); the one new dep (PIPE-08)
    "claude-agent-sdk==0.2.139",  # headless agent runtime (query/output_format/@tool)
    "beautifulsoup4==4.15.0",  # Federal Register PDUFA HTML parsing (providers/pdufa*.py)
    "lxml==6.1.1",  # BeautifulSoup parser backend used by providers/pdufa.py
    "yfinance==1.6.0",  # paper-phase price bars (providers/prices.py)
    "pandas==3.0.5",  # price-bar frames (providers/prices.py); also transitively via statsmodels
]

[project.optional-dependencies]
# Real semantic embeddings for the KB (BAAI/bge-large-en-v1.5, 1024-dim, local ONNX — no API).
# Optional: without it the KB falls back to the offline deterministic hash embedder.
embeddings = [
    "fastembed>=0.4",
]
dev = [
    "pytest==9.1.1",
    "pytest-httpx==0.36.2",
    "pytest-asyncio",  # async def test support for the run_structured() seam
    "freezegun==1.5.5",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
catalyst_trader = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
