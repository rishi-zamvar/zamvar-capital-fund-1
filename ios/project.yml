name: Fund1Dashboard
options:
  bundleIdPrefix: com.rishizamvar
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  Fund1Kit:
    path: Fund1Kit
settings:
  base:
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "373D7DZ9NM"
targets:
  Fund1Dashboard:
    type: application
    platform: iOS
    sources:
      - path: Fund1Dashboard
        excludes:
          - "**/.DS_Store"
    info:
      path: Fund1Dashboard/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: Fund 1
        ITSAppUsesNonExemptEncryption: false
        # Internal app: plain HTTP to the shim over the Tailscale tunnel (100.x).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rishizamvar.fund1dashboard
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: Fund1Kit
schemes:
  Fund1Dashboard:
    build:
      targets:
        Fund1Dashboard: all
    test:
      targets:
        - package: Fund1Kit/Fund1KitTests
